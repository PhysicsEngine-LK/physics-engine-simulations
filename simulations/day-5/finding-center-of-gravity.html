<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <title>Finding Center of Gravity - Physics Engine</title>
    <style>
        body { 
            background-color: #f4f6f9; 
            color: #2c3e50; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            margin: 0; 
        }
        .canvas-container {
            background-color: #ffffff; 
            border: 2px solid #6c5ce7;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); 
            padding: 20px;
            margin-bottom: 20px;
            width: 850px;
            text-align: center;
        }
        .title {
            color: #2c3e50;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .desc {
            color: #555555;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .controls {
            background-color: #e0e7ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #076ebf; }
        button:active { transform: translateY(2px); }
        
        .btn-mark { background-color: #e67e22; }
        .btn-mark:hover { background-color: #d35400; }
        .btn-mark:disabled { background-color: #bdc3c7; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-reset { background-color: #e74c3c; }
        .btn-reset:hover { background-color: #c0392b; }

        #result-text {
            font-size: 18px;
            font-weight: bold;
            color: #27ae60;
            margin-top: 10px;
            min-height: 25px;
        }
    </style>
</head>
<body>

<div class="canvas-container">
    <div class="title">ආස්තරයක ගුරුත්ව කේන්ද්‍රය (CG) සෙවීම</div>
    <div class="desc">A, C හෝ E ලක්ෂ්‍යවලින් ආස්තරය එල්ලා, සමතුලිත වූ පසු සිරස් රේඛාව (ලඹයේ රේඛාව) ආස්තරය මත ලකුණු කරන්න. රේඛා 2ක් ඡේදනය වන විට ගුරුත්ව කේන්ද්‍රය (G) හමුවේ.</div>
    
    <div class="controls">
        <button onclick="hangLamina('A')">A ගෙන් එල්ලන්න</button>
        <button onclick="hangLamina('C')">C ගෙන් එල්ලන්න</button>
        <button onclick="hangLamina('E')">E ගෙන් එල්ලන්න</button>
        <div style="width: 2px; height: 30px; background-color: #bdc3c7; margin: 0 5px;"></div>
        <button id="btnDraw" class="btn-mark" onclick="drawVerticalLine()">සිරස් රේඛාව ලකුණු කරන්න</button>
        <div style="width: 2px; height: 30px; background-color: #bdc3c7; margin: 0 5px;"></div>
        <button class="btn-reset" onclick="resetSim()">මුල් පිහිටීමට (Reset)</button>
    </div>
    
    <div id="result-text"></div>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="450">
        
        <!-- Stand Base & Arm -->
        <rect x="390" y="380" width="20" height="70" fill="#7f8c8d" />
        <rect x="300" y="430" width="200" height="20" fill="#2c3e50" rx="5" />
        <rect x="395" y="30" width="10" height="360" fill="#7f8c8d" />
        <rect x="395" y="30" width="80" height="15" fill="#7f8c8d" rx="4" />
        
        <!-- Plumb Line (ලඹය) - Hanging straight down from pivot -->
        <line x1="465" y1="40" x2="465" y2="400" stroke="#34495e" stroke-width="2" stroke-dasharray="8,4" />
        <circle cx="465" cy="400" r="10" fill="#e74c3c" />
        <path d="M 460 400 L 470 400 L 465 420 Z" fill="#e74c3c" />

        <!-- Lamina Group -->
        <g id="laminaGroup" style="transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 0 0;">
            
            <!-- Irregular Lamina Shape -->
            <path d="M -100 -50 Q -30 -140 60 -100 T 130 -10 Q 180 80 80 130 T -80 120 Q -150 50 -100 -50 Z" 
                  fill="#fdebd0" stroke="#e67e22" stroke-width="5" />
            
            <!-- Group to hold dynamically drawn lines -->
            <g id="drawnLines"></g>
            
            <!-- Hole A -->
            <circle cx="-80" cy="-70" r="6" fill="#2c3e50" />
            <text x="-95" y="-80" fill="#2c3e50" font-weight="bold" font-size="18">A</text>
            
            <!-- Hole C -->
            <circle cx="100" cy="-30" r="6" fill="#2c3e50" />
            <text x="110" y="-40" fill="#2c3e50" font-weight="bold" font-size="18">C</text>

            <!-- Hole E -->
            <circle cx="-20" cy="90" r="6" fill="#2c3e50" />
            <text x="-15" y="115" fill="#2c3e50" font-weight="bold" font-size="18">E</text>

            <!-- CG Point (Hidden initially) -->
            <g id="cgPointGroup" style="opacity: 0; transition: opacity 0.5s;">
                <circle cx="20" cy="30" r="8" fill="#27ae60" />
                <circle cx="20" cy="30" r="16" fill="none" stroke="#27ae60" stroke-width="3" />
                <text x="35" y="36" fill="#27ae60" font-weight="bold" font-size="20">G</text>
            </g>

        </g>
        
        <!-- Pivot Pin (Global Space) -->
        <circle cx="465" cy="40" r="7" fill="#f1c40f" stroke="#2c3e50" stroke-width="2" />

    </svg>
</div>

<script>
    // Physics / Geometry configuration
    const pivot = { x: 465, y: 40 }; // Global coordinates of the pin
    const cg = { x: 20, y: 30 }; // Local coordinates of the true CG
    
    // Local coordinates of the suspension holes
    const holes = {
        'A': { x: -80, y: -70 },
        'C': { x: 100, y: -30 },
        'E': { x: -20, y: 90 }
    };

    let currentHole = null;
    let markedLines = new Set();
    
    const lamina = document.getElementById('laminaGroup');
    const drawnLinesGroup = document.getElementById('drawnLines');
    const cgPointGroup = document.getElementById('cgPointGroup');
    const btnDraw = document.getElementById('btnDraw');
    const resultText = document.getElementById('result-text');

    function hangLamina(holeName) {
        currentHole = holeName;
        const pt = holes[holeName];
        
        const dx = cg.x - pt.x;
        const dy = cg.y - pt.y;
        
        const angleRad = Math.atan2(dy, dx);
        const angleDeg = angleRad * (180 / Math.PI);
        
        const requiredRotation = 90 - angleDeg;
        
        lamina.style.transform = `translate(${pivot.x}px, ${pivot.y}px) rotate(${requiredRotation}deg) translate(${-pt.x}px, ${-pt.y}px)`;
        
        if (markedLines.has(holeName)) {
            btnDraw.disabled = true;
            btnDraw.textContent = "රේඛාව ලකුණු කර ඇත";
        } else {
            btnDraw.disabled = false;
            btnDraw.textContent = "සිරස් රේඛාව ලකුණු කරන්න";
        }
    }

    function drawVerticalLine() {
        if (!currentHole || markedLines.has(currentHole)) return;
        
        markedLines.add(currentHole);
        const pt = holes[currentHole];
        
        const dx = cg.x - pt.x;
        const dy = cg.y - pt.y;
        
        const extendX = pt.x + (dx * 6);
        const extendY = pt.y + (dy * 6);
        
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", pt.x);
        line.setAttribute("y1", pt.y);
        line.setAttribute("x2", extendX);
        line.setAttribute("y2", extendY);
        line.setAttribute("stroke", "#34495e");
        line.setAttribute("stroke-width", "3");
        
        drawnLinesGroup.appendChild(line);
        
        btnDraw.disabled = true;
        btnDraw.textContent = "රේඛාව ලකුණු කර ඇත";
        
        if (markedLines.size >= 2) {
            cgPointGroup.style.opacity = 1;
            resultText.textContent = "විශිෂ්ටයි! ඡේදනය වන ලක්ෂ්‍යය ආස්තරයේ ගුරුත්ව කේන්ද්‍රය (G) වේ.";
        }
    }

    function resetSim() {
        // Clear logic states
        markedLines.clear();
        currentHole = null;
        
        // Clear visual states
        drawnLinesGroup.innerHTML = '';
        cgPointGroup.style.opacity = 0;
        resultText.textContent = '';
        
        // Hang back from 'A' initially
        hangLamina('A');
    }

    // Initialize by hanging from A
    setTimeout(() => { hangLamina('A'); }, 300);

</script>

</body>
</html>
