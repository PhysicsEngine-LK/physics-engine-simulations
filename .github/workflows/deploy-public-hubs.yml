name: Deploy public learning hubs

on:
  push:
    branches:
      - main
    paths:
      - simulations/**
      - quizes/**
      - .github/pages-404.html
      - .github/workflows/deploy-public-hubs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build restricted site artifact
        shell: bash
        run: |
          mkdir -p _site
          cp -R simulations _site/simulations
          cp -R quizes _site/quizes
          cp .github/pages-404.html _site/404.html
          find _site -name .gitkeep -delete
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload restricted site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
