<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>CG Path Simulation - Physics Engine</title>
    <style>
        body { 
            background-color: #f4f6f9; 
            color: #2c3e50; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            margin: 0; 
        }
        .canvas-container {
            background-color: #ffffff; 
            border: 2px solid #6c5ce7;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); 
            padding: 25px;
            margin-bottom: 20px;
            width: 850px;
            text-align: center;
        }
        .title { color: #2c3e50; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .desc { color: #555555; font-size: 15px; margin-bottom: 20px; }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            background-color: #e0e7ff;
            padding: 15px;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-axe { background-color: #e67e22; } .btn-axe:hover { background-color: #d35400; }
        .btn-boom { background-color: #0984e3; } .btn-boom:hover { background-color: #076ebf; }
        .btn-reset { background-color: #7f8c8d; } .btn-reset:hover { background-color: #95a5a6; }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .info-panel {
            background-color: #fdf2e9;
            border-left: 5px solid #e74c3c;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            font-size: 15px;
            color: #c0392b;
            font-weight: bold;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
        }
        input[type="checkbox"] {
            accent-color: #6c5ce7;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="canvas-container">
    <div class="title">වස්තුවක භ්‍රමණය සහ ගුරුත්ව කේන්ද්‍රයේ (CG) පථය</div>
    <div class="desc">පොරව සහ බූමරංගය විසි කර, CG ගමන් කරන සරල පථයත්, වස්තුවේ කෙළවරක් ගමන් කරන සංකීර්ණ පථයත් සසඳා බලන්න.</div>
    
    <div class="controls">
        <button class="btn-axe" onclick="playSim('axe')">පොරව විසි කරන්න (Axe Throw)</button>
        <button class="btn-boom" onclick="playSim('boom')">බූමරංගය විසි කරන්න (Boomerang)</button>
        <button class="btn-reset" onclick="resetSim()">Clear</button>
        
        <label class="checkbox-group">
            <input type="checkbox" id="showTipPath" checked onchange="togglePaths()"> වස්තුවේ දාරයේ (Tip) සංකීර්ණ පථය පෙන්වන්න
        </label>
    </div>
    
    <svg id="simSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="400">
        <!-- Sky & Ground -->
        <rect x="0" y="0" width="850" height="400" fill="#f8fdfd" />
        <line x1="0" y1="350" x2="850" y2="350" stroke="#7f8c8d" stroke-width="4"/>
        <text x="750" y="375" fill="#7f8c8d" font-weight="bold">Ground</text>

        <!-- Target (for Axe) -->
        <g id="targetGroup" transform="translate(750, 200)" opacity="0">
            <rect x="-10" y="0" width="20" height="150" fill="#8e44ad"/>
            <circle cx="0" cy="0" r="30" fill="#e74c3c"/>
            <circle cx="0" cy="0" r="20" fill="#ffffff"/>
            <circle cx="0" cy="0" r="10" fill="#e74c3c"/>
        </g>

        <!-- Thrower -->
        <circle cx="50" cy="300" r="15" fill="#2c3e50"/>
        <rect x="40" y="315" width="20" height="35" fill="#2c3e50"/>
        <line x1="60" y1="320" x2="80" y2="290" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>

        <!-- Path Traces -->
        <path id="traceTip" fill="none" stroke="#3498db" stroke-width="2" opacity="0.6"/>
        <path id="traceCG" fill="none" stroke="#e74c3c" stroke-width="4" stroke-dasharray="8,4"/>

        <!-- Object Container -->
        <g id="objectGroup" transform="translate(-100, -100)">
            
            <!-- AXE (Hidden initially) -->
            <g id="axeSvg" opacity="0">
                <rect x="-5" y="-30" width="10" height="70" fill="#8B4513" rx="4"/>
                <path d="M 5 -20 L 25 -25 L 25 -5 L 5 -10 Z" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
                <!-- Axe CG Marker -->
                <circle cx="0" cy="0" r="5" fill="#e74c3c"/>
            </g>

            <!-- BOOMERANG (Hidden initially) -->
            <g id="boomSvg" opacity="0">
                <path d="M -25 -25 Q -10 -25 -5 -5 L -5 20 Q -5 30 5 30 Q 15 30 15 20 L 15 -10 Q 15 -35 -10 -35 L -25 -35 Z" fill="#d35400" stroke="#a04000" stroke-width="2"/>
                <!-- Boomerang CG Marker (Outside the body!) -->
                <circle cx="0" cy="0" r="5" fill="#e74c3c"/>
                <line x1="0" y1="0" x2="10" y2="-20" stroke="#e74c3c" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="0" y1="0" x2="-15" y2="10" stroke="#e74c3c" stroke-width="1" stroke-dasharray="2,2"/>
            </g>
            
        </g>
    </svg>

    <div class="legend">
        <span style="color: #e74c3c;">● රතු ඉරි කඩනය: ගුරුත්ව කේන්ද්‍රයේ (CG) සුමට පථය</span>
        <span style="color: #3498db;">● නිල් රේඛාව: වස්තුවේ දාරයේ (Tip) සංකීර්ණ පථය</span>
    </div>

    <div id="infoPanel" class="info-panel" style="display: none;">
        <!-- Dynamic text will appear here -->
    </div>
</div>

<script>
    const objectGroup = document.getElementById('objectGroup');
    const axeSvg = document.getElementById('axeSvg');
    const boomSvg = document.getElementById('boomSvg');
    const targetGroup = document.getElementById('targetGroup');
    const traceCG = document.getElementById('traceCG');
    const traceTip = document.getElementById('traceTip');
    const showTipCheckbox = document.getElementById('showTipPath');
    const infoPanel = document.getElementById('infoPanel');

    let animId;
    let t = 0;
    let mode = '';
    let pathCGStr = '';
    let pathTipStr = '';
    let isPlaying = false;

    function resetSim() {
        cancelAnimationFrame(animId);
        isPlaying = false;
        t = 0;
        pathCGStr = '';
        pathTipStr = '';
        traceCG.setAttribute('d', '');
        traceTip.setAttribute('d', '');
        
        axeSvg.setAttribute('opacity', 0);
        boomSvg.setAttribute('opacity', 0);
        targetGroup.setAttribute('opacity', 0);
        objectGroup.setAttribute('transform', `translate(-100, -100)`);
        
        infoPanel.style.display = 'none';
    }

    function togglePaths() {
        if (showTipCheckbox.checked) {
            traceTip.style.display = 'block';
        } else {
            traceTip.style.display = 'none';
        }
    }

    function playSim(selectedMode) {
        resetSim();
        mode = selectedMode;
        isPlaying = true;
        
        if (mode === 'axe') {
            axeSvg.setAttribute('opacity', 1);
            targetGroup.setAttribute('opacity', 1);
            pathCGStr = `M 80 290 `;
            pathTipStr = `M 105 265 `; // Initial approx tip position
            
            infoPanel.innerHTML = "<b>පොරව (Axe):</b> වායු ප්‍රතිරෝධය නොසලකා හැරිය විට, එහි ගුරුත්ව කේන්ද්‍රය (CG) ගමන් කරන්නේ පිරිසිදු <b>පරාවලයික පථයකය (Parabola)</b>. පොරව කෙතරම් භ්‍රමණය වුවද, CG හි එම සුමට පථය කිසිසේත් වෙනස් නොවේ.";
            infoPanel.style.display = 'block';
            infoPanel.style.borderColor = "#e67e22";
            
        } else if (mode === 'boom') {
            boomSvg.setAttribute('opacity', 1);
            pathCGStr = `M 80 290 `;
            pathTipStr = `M 65 255 `; 
            
            infoPanel.innerHTML = "<b>බූමරංගය (Boomerang):</b> මෙහි විශේෂත්වය වන්නේ ගුරුත්ව කේන්ද්‍රය (CG) වස්තුවෙන් පිටත හිස් අවකාශයේ පිහිටීමයි! වායුගතික බල (Aerodynamic lift) නිසා එහි CG පරාවලයක් වෙනුවට <b>ආපසු එන වක්‍රයක් (Returning loop)</b> සාදයි. එහෙත් සම්පූර්ණ බූමරංගයම භ්‍රමණය වන්නේ එම අදෘශ්‍යමාන CG ලක්ෂ්‍යය වටාමය!";
            infoPanel.style.display = 'block';
            infoPanel.style.borderColor = "#0984e3";
        }
        
        animate();
    }

    function animate() {
        if (!isPlaying) return;
        
        t += 0.015; // Time step
        let cx, cy, angle, tipX, tipY;
        
        if (mode === 'axe') {
            // Axe Math: Simple Projectile (Parabola)
            // Starts at (80, 290). Target at (750, 200). Takes ~1.2 time units.
            let v_x = (750 - 80) / 1.2;
            let v_y = 350; // Initial upward velocity
            let g = 600;   // Gravity
            
            cx = 80 + v_x * t;
            cy = 290 - (v_y * t - 0.5 * g * t * t);
            angle = t * 600; // Rotation speed
            
            // Calculate Tip position (Blade edge is approx 20px right, -25px up from CG)
            let rad = angle * (Math.PI / 180);
            let localTx = 25;
            let localTy = -20;
            tipX = cx + (localTx * Math.cos(rad) - localTy * Math.sin(rad));
            tipY = cy + (localTx * Math.sin(rad) + localTy * Math.cos(rad));
            
            if (cx >= 750) {
                isPlaying = false; // Hit target
            }
            
        } else if (mode === 'boom') {
            // Boomerang Math: Returning Path (Ellipse/Loop)
            // Starts at 80, 290. Returns near there.
            let phase = t * Math.PI * 1.5; // Controls the loop progression
            
            // Parametric returning loop
            cx = 80 + 600 * Math.sin(t * Math.PI * 0.8);
            cy = 290 - 250 * Math.sin(t * Math.PI * 1.6);
            angle = t * 1200; // Spins much faster
            
            // Tip position (Wing tip is approx -25px left, -35px up from CG)
            let rad = angle * (Math.PI / 180);
            let localTx = -25;
            let localTy = -35;
            tipX = cx + (localTx * Math.cos(rad) - localTy * Math.sin(rad));
            tipY = cy + (localTx * Math.sin(rad) + localTy * Math.cos(rad));
            
            if (t > 1.25) { // Return trip complete
                isPlaying = false;
            }
        }
        
        // Update Object Transform
        objectGroup.setAttribute('transform', `translate(${cx}, ${cy}) rotate(${angle})`);
        
        // Update Path Strings
        pathCGStr += `L ${cx} ${cy} `;
        pathTipStr += `L ${tipX} ${tipY} `;
        
        traceCG.setAttribute('d', pathCGStr);
        traceTip.setAttribute('d', pathTipStr);
        
        if (isPlaying) {
            animId = requestAnimationFrame(animate);
        }
    }
</script>

</body>
</html>
