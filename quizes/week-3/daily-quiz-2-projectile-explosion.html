<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Projectile Explosion & CM - Physics Engine</title>
    <style>
        body { 
            background-color: #f8f9fa; 
            color: #2c3e50; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }
        .canvas-container { 
            background-color: #ffffff; 
            border: 2px solid #6c5ce7; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            padding: 25px; 
            width: 900px; 
            text-align: center; 
        }
        .title { color: #2c3e50; font-size: 24px; font-weight: 800; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 15px; margin-bottom: 20px; }
        
        .controls { 
            background-color: #eef2f5; 
            padding: 15px 30px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: center;
            gap: 20px;
            border: 1px solid #dcdde1;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            background-color: #0984e3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #076ebf; transform: translateY(-2px); }
        .btn-reset { background-color: #e74c3c; }
        .btn-reset:hover { background-color: #c0392b; }
        
        .logic-box { 
            background-color: #fdf2e9; 
            border-left: 6px solid #e67e22; 
            padding: 15px; 
            font-size: 17px; 
            font-weight: bold; 
            color: #d35400; 
            width: 90%; 
            margin: 10px auto 0; 
            display: flex; 
            justify-content: space-around;
            border-radius: 0 8px 8px 0;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

<div class="canvas-container">
    <div class="title">අභ්‍යන්තර පිපිරීම සහ ස්කන්ධ කේන්ද්‍රය (CM)</div>
    <div class="subtitle">10kg උණ්ඩය ගමන් පථයේ මුදුනේදී 4kg සහ 6kg ලෙස කැඩී යාමේ සීසෝ තර්කනය නිරීක්ෂණය කරන්න.</div>
    
    <div class="controls">
        <button onclick="playAnim()">▶ Play Simulation</button>
        <button class="btn-reset" onclick="resetAnim()">Reset</button>
    </div>

    <svg id="simSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="450">
        <!-- Axes -->
        <line x1="50" y1="350" x2="850" y2="350" stroke="#bdc3c7" stroke-width="3"/>
        <text x="850" y="340" fill="#7f8c8d" font-weight="bold">x (m)</text>
        
        <!-- Distance Markers -->
        <!-- 0m -->
        <line x1="50" y1="345" x2="50" y2="355" stroke="#2c3e50" stroke-width="2"/>
        <text x="50" y="375" fill="#2c3e50" font-weight="bold" text-anchor="middle">0 m</text>
        
        <!-- 60m -->
        <line x1="290" y1="345" x2="290" y2="355" stroke="#2c3e50" stroke-width="2"/>
        <text x="290" y="375" fill="#2c3e50" font-weight="bold" text-anchor="middle">60 m</text>
        <text id="lblM1" x="290" y="395" fill="#e74c3c" font-weight="bold" text-anchor="middle" opacity="0">4 kg</text>

        <!-- 120m (CM) -->
        <line x1="530" y1="345" x2="530" y2="355" stroke="#27ae60" stroke-width="3"/>
        <text x="530" y="375" fill="#27ae60" font-weight="bold" text-anchor="middle">120 m (CM)</text>
        
        <!-- 160m -->
        <line x1="690" y1="345" x2="690" y2="355" stroke="#2c3e50" stroke-width="2"/>
        <text id="lblM2Dist" x="690" y="375" fill="#2c3e50" font-weight="bold" text-anchor="middle" opacity="0">160 m</text>
        <text id="lblM2" x="690" y="395" fill="#0984e3" font-weight="bold" text-anchor="middle" opacity="0">6 kg</text>

        <!-- Paths -->
        <path id="pathMain" fill="none" stroke="#95a5a6" stroke-width="3" stroke-dasharray="6,4" opacity="0.5"/>
        <path id="pathM1" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="4,4"/>
        <path id="pathM2" fill="none" stroke="#0984e3" stroke-width="3" stroke-dasharray="4,4"/>
        <path id="pathCM" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="6,4" opacity="0"/>

        <!-- Balls -->
        <!-- 10kg Main Ball -->
        <circle id="ballMain" cx="50" cy="350" r="15" fill="#2c3e50"/>
        <text id="txtMain" x="50" y="345" fill="white" font-size="10" font-weight="bold" text-anchor="middle">10kg</text>
        
        <!-- CM Ghost Ball -->
        <circle id="ballCM" cx="50" cy="350" r="10" fill="none" stroke="#27ae60" stroke-width="3" opacity="0"/>
        
        <!-- 4kg Ball -->
        <circle id="ball1" cx="50" cy="350" r="10" fill="#e74c3c" opacity="0"/>
        <text id="txt1" x="50" y="346" fill="white" font-size="9" font-weight="bold" text-anchor="middle" opacity="0">4kg</text>
        
        <!-- 6kg Ball -->
        <circle id="ball2" cx="50" cy="350" r="12" fill="#0984e3" opacity="0"/>
        <text id="txt2" x="50" y="346" fill="white" font-size="9" font-weight="bold" text-anchor="middle" opacity="0">6kg</text>

        <!-- Explosion Effect -->
        <g id="explosion" opacity="0">
            <circle cx="290" cy="110" r="25" fill="#f1c40f" opacity="0.8"/>
            <polygon points="290,70 295,95 320,90 300,105 325,120 295,115 290,140 285,115 255,120 280,105 255,90 285,95" fill="#e67e22"/>
            <text x="290" y="115" fill="white" font-weight="bold" font-size="14" text-anchor="middle">BOOM</text>
        </g>

        <!-- Seesaw Visual (Hidden initially) -->
        <g id="seesawGroup" opacity="0" transform="translate(0, 50)">
            <polygon points="530,345 520,370 540,370" fill="#27ae60"/>
            <line x1="290" y1="345" x2="690" y2="345" stroke="#f39c12" stroke-width="6"/>
            <!-- Distances -->
            <line x1="290" y1="330" x2="530" y2="330" stroke="#c0392b" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
            <text x="410" y="325" fill="#c0392b" font-weight="bold" text-anchor="middle">d₁ = 60 m</text>
            
            <line x1="530" y1="330" x2="690" y2="330" stroke="#2980b9" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
            <text x="610" y="325" fill="#2980b9" font-weight="bold" text-anchor="middle">d₂ = 40 m</text>
        </g>
    </svg>

    <div class="logic-box" id="logicBox">
        <div>m₁ × d₁ = 4 kg × 60 m = <b>240</b></div>
        <div style="font-size: 20px;">⚖️</div>
        <div>m₂ × d₂ = 6 kg × 40 m = <b>240</b></div>
    </div>
</div>

<script>
    const ballMain = document.getElementById('ballMain');
    const txtMain = document.getElementById('txtMain');
    const ballCM = document.getElementById('ballCM');
    const ball1 = document.getElementById('ball1');
    const txt1 = document.getElementById('txt1');
    const ball2 = document.getElementById('ball2');
    const txt2 = document.getElementById('txt2');
    
    const explosion = document.getElementById('explosion');
    const seesawGroup = document.getElementById('seesawGroup');
    const logicBox = document.getElementById('logicBox');
    
    const lblM1 = document.getElementById('lblM1');
    const lblM2 = document.getElementById('lblM2');
    const lblM2Dist = document.getElementById('lblM2Dist');
    
    const pathMain = document.getElementById('pathMain');
    const pathM1 = document.getElementById('pathM1');
    const pathM2 = document.getElementById('pathM2');
    const pathCM = document.getElementById('pathCM');

    let animId;
    let t = 0; // x_cm mapped from 50 to 530 (0 to 120m)
    
    // Scale: 1m = 4px. 
    // Start X = 50px (0m). 
    // Apex X = 290px (60m). Apex Y = 110px.
    // End CM X = 530px (120m). Ground Y = 350px.
    // End M2 X = 690px (160m).
    
    // Original Parabola: y = a(x - 290)^2 + 110
    // Passes through (50, 350): 350 = a(-240)^2 + 110 => 240 = a(57600) => a = 1/240
    
    // Initialize Full CM Path drawing
    let cmPathD = "";
    for(let x = 50; x <= 530; x+=5) {
        let y = (Math.pow(x - 290, 2) / 240) + 110;
        cmPathD += (x===50?"M ":"L ") + x + " " + y;
    }
    pathMain.setAttribute('d', cmPathD);

    function getParabolaY(x, apexX, a, apexY) {
        return (a * Math.pow(x - apexX, 2)) + apexY;
    }

    function resetAnim() {
        cancelAnimationFrame(animId);
        t = 50;
        
        ballMain.setAttribute('opacity', 1);
        txtMain.setAttribute('opacity', 1);
        ballCM.setAttribute('opacity', 0);
        pathCM.setAttribute('opacity', 0);
        
        ball1.setAttribute('opacity', 0); txt1.setAttribute('opacity', 0);
        ball2.setAttribute('opacity', 0); txt2.setAttribute('opacity', 0);
        
        explosion.setAttribute('opacity', 0);
        seesawGroup.setAttribute('opacity', 0);
        logicBox.style.opacity = 0;
        
        lblM1.setAttribute('opacity', 0);
        lblM2.setAttribute('opacity', 0);
        lblM2Dist.setAttribute('opacity', 0);
        
        pathM1.setAttribute('d', "");
        pathM2.setAttribute('d', "");
        
        setBallPos(ballMain, txtMain, 50, 350);
    }

    function setBallPos(ball, text, x, y) {
        ball.setAttribute('cx', x);
        ball.setAttribute('cy', y);
        text.setAttribute('x', x);
        text.setAttribute('y', y + 4); // text centering adjustment
    }

    function playAnim() {
        resetAnim();
        t = 50;
        
        let path1Str = "M 290 110 ";
        let path2Str = "M 290 110 ";
        
        function step() {
            t += 4; // speed
            
            if (t <= 290) {
                // Phase 1: 10kg ball moving up
                let y = getParabolaY(t, 290, 1/240, 110);
                setBallPos(ballMain, txtMain, t, y);
            } 
            else if (t > 290 && t <= 530) {
                // Explosion trigger
                if(t - 4 <= 290) {
                    ballMain.setAttribute('opacity', 0);
                    txtMain.setAttribute('opacity', 0);
                    explosion.setAttribute('opacity', 1);
                    setTimeout(() => explosion.setAttribute('opacity', 0), 300);
                    
                    ballCM.setAttribute('opacity', 1);
                    pathCM.setAttribute('opacity', 1);
                    ball1.setAttribute('opacity', 1); txt1.setAttribute('opacity', 1);
                    ball2.setAttribute('opacity', 1); txt2.setAttribute('opacity', 1);
                }
                
                // Common time fraction from apex to ground (t ranges 290 to 530, so delta = 240)
                let timeFrac = (t - 290) / 240; 
                let currentY = 110 + 240 * (timeFrac * timeFrac); // Fall equation y = 110 + 240*t^2
                
                // CM Ball
                ballCM.setAttribute('cx', t);
                ballCM.setAttribute('cy', currentY);
                
                // 4kg Ball drops straight down
                let x1 = 290;
                setBallPos(ball1, txt1, x1, currentY);
                path1Str += `L ${x1} ${currentY} `;
                pathM1.setAttribute('d', path1Str);
                
                // 6kg Ball moves from 290 to 690 (delta = 400)
                let x2 = 290 + (400 * timeFrac);
                setBallPos(ball2, txt2, x2, currentY);
                path2Str += `L ${x2} ${currentY} `;
                pathM2.setAttribute('d', path2Str);
            }
            else {
                // Reached ground
                lblM1.setAttribute('opacity', 1);
                lblM2.setAttribute('opacity', 1);
                lblM2Dist.setAttribute('opacity', 1);
                
                seesawGroup.setAttribute('opacity', 1);
                logicBox.style.opacity = 1;
                return;
            }
            
            animId = requestAnimationFrame(step);
        }
        
        step();
    }
    
    resetAnim();
</script>

</body>
</html>
