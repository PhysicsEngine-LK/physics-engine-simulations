<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Daily Quiz 2 Answers | Physics Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme:dark; --accent:#a78bfa; --accent2:#f472b6; --text:#f5f0ff; --muted:rgba(245,240,255,.65); --line:rgba(167,139,250,.3); }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:clamp(20px,5vw,56px); color:var(--text); font-family:"Space Grotesk",sans-serif; background:radial-gradient(circle at 10% 10%,rgba(167,139,250,.2),transparent 35%),radial-gradient(circle at 90% 80%,rgba(244,114,182,.12),transparent 38%),#07040e; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background-image:linear-gradient(rgba(167,139,250,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,.05) 1px,transparent 1px); background-size:46px 46px; }
    main { position:relative; max-width:900px; margin:auto; }
    header { margin-bottom:22px; }
    .eyebrow { color:var(--accent2); font-family:"Orbitron",sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; }
    h1 { margin:10px 0 8px; font-family:"Orbitron",sans-serif; font-size:clamp(28px,6vw,50px); letter-spacing:1px; }
    header p { margin:0; color:var(--muted); font-size:17px; }
    .answers { display:grid; gap:18px; padding:clamp(16px,3vw,28px); border:1px solid var(--line); border-left:4px solid var(--accent2); border-radius:18px; background:rgba(20,11,36,.88); box-shadow:0 24px 55px rgba(0,0,0,.4); }
    figure { margin:0; overflow:hidden; border-radius:10px; background:#fff; }
    img { display:block; width:100%; height:auto; }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">Week 1</span>
      <h1>Daily Quiz 2 Answers</h1>
      <p>Worked answers for questions 16–30.</p>
    </header>
    <section class="answers" aria-label="Daily Quiz 2 worked answers">
      <figure><img src="daily-quiz-2-answers/answers-16-21.png" alt="Worked answers for questions 16 through 21" /></figure>
      <figure><img src="daily-quiz-2-answers/answers-22-25.png" alt="Worked answers for questions 22 through 25" loading="lazy" /></figure>
      <figure><img src="daily-quiz-2-answers/answer-26.png" alt="Worked answer for question 26" loading="lazy" /></figure>
      <figure><img src="daily-quiz-2-answers/answers-27-29.png" alt="Worked answers for questions 27 through 29" loading="lazy" /></figure>
      <figure><img src="daily-quiz-2-answers/answer-30.png" alt="Worked answer for question 30" loading="lazy" /></figure>
    </section>
  </main>
</body>
</html>
