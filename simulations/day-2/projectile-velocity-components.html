<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <title>Projectile Velocity Components - Physics Engine</title>
    <style>
        body { 
            background-color: #f4f6f9; 
            color: #2c3e50; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            margin: 0; 
        }
        .canvas-container {
            background-color: #ffffff; 
            border: 2px solid #6c5ce7;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); 
            padding: 25px;
            margin-bottom: 20px;
            width: 850px;
        }
        .title {
            color: #2c3e50;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .desc {
            color: #555555;
            font-size: 15px;
            text-align: center;
            margin-bottom: 25px;
        }
        .sim-area {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .panel {
            flex: 1;
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            padding: 10px;
            position: relative;
        }
        .panel-title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            color: #34495e;
        }
        .controls {
            text-align: center;
            margin-top: 25px;
        }
        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #076ebf; }
        .btn-reset { background-color: #e74c3c; }
        .btn-reset:hover { background-color: #c0392b; }
        
        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 15px;
        }
        .leg-h { color: #0984e3; }
        .leg-v { color: #e74c3c; }
    </style>
</head>
<body>

<div class="canvas-container">
    <div class="title">2013 A/L (MCQ 8) - ප්‍රක්ෂිප්ත චලිතයේ ප්‍රවේග ප්‍රස්ථාර</div>
    
    <div class="sim-area">
        <!-- Motion Panel -->
        <div class="panel">
            <div class="panel-title">භෞතික චලිතය (Physical Motion)</div>
            <svg id="motionSvg" viewBox="0 0 400 300" width="100%" height="250">
                <defs>
                    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0984e3" />
                    </marker>
                    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e74c3c" />
                    </marker>
                </defs>

                <!-- Ground -->
                <line x1="20" y1="230" x2="380" y2="230" stroke="#7f8c8d" stroke-width="3"/>
                
                <!-- Path Trace -->
                <path id="pathTrace" fill="none" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="4,4"/>
                
                <!-- Projectile Ball -->
                <circle id="ball" cx="40" cy="230" r="8" fill="#2c3e50"/>
                
                <!-- Velocity Vectors -->
                <line id="vhArrow" x1="40" y1="230" x2="100" y2="230" stroke="#0984e3" stroke-width="3" marker-end="url(#arrowBlue)"/>
                <text id="vhText" x="105" y="235" fill="#0984e3" font-weight="bold" font-size="14">v_H</text>

                <line id="vvArrow" x1="40" y1="230" x2="40" y2="150" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowRed)"/>
                <text id="vvText" x="15" y="145" fill="#e74c3c" font-weight="bold" font-size="14">v_V</text>
            </svg>
        </div>

        <!-- Graph Panel -->
        <div class="panel">
            <div class="panel-title">ප්‍රවේග - කාල ප්‍රස්ථාරය (v-t Graph)</div>
            <svg id="graphSvg" viewBox="0 0 400 300" width="100%" height="250">
                <!-- Axes -->
                <line x1="40" y1="20" x2="40" y2="260" stroke="#2c3e50" stroke-width="2"/> <!-- Y Axis (v) -->
                <line x1="30" y1="140" x2="380" y2="140" stroke="#2c3e50" stroke-width="2"/> <!-- X Axis (t) at v=0 -->
                
                <!-- Axis Labels -->
                <text x="25" y="15" fill="#2c3e50" font-weight="bold" font-size="14">v</text>
                <text x="385" y="135" fill="#2c3e50" font-weight="bold" font-size="14">t</text>
                <text x="25" y="155" fill="#2c3e50" font-weight="bold" font-size="12">0</text>

                <!-- Dynamic Graph Lines -->
                <polyline id="vhGraph" fill="none" stroke="#0984e3" stroke-width="3"/>
                <polyline id="vvGraph" fill="none" stroke="#e74c3c" stroke-width="3"/>
            </svg>
        </div>
    </div>

    <div class="legend">
        <span class="leg-h">■ තිරස් ප්‍රවේගය (v_H) - නියතයි</span>
        <span class="leg-v">■ සිරස් ප්‍රවේගය (v_V) - වෙනස් වේ</span>
    </div>

    <div class="controls">
        <button onclick="playSim()">Play (ආරම්භ කරන්න)</button>
        <button class="btn-reset" onclick="resetSim()">Reset (මුල් පිහිටීමට)</button>
    </div>
</div>

<script>
    // Physics Parameters
    const v_x = 55;        // Constant horizontal velocity
    const v_y0 = 85;       // Initial vertical velocity
    const g = 34;          // Gravity
    const max_t = (2 * v_y0) / g; // Time of flight (approx 5.0 seconds)

    // State Variables
    let t = 0;
    let dt = 0.035;        // Time step per frame
    let isPlaying = false;
    let animId;

    // SVG Element References
    const ball = document.getElementById('ball');
    const pathTrace = document.getElementById('pathTrace');
    const vhArrow = document.getElementById('vhArrow');
    const vvArrow = document.getElementById('vvArrow');
    const vhText = document.getElementById('vhText');
    const vvText = document.getElementById('vvText');
    const vhGraph = document.getElementById('vhGraph');
    const vvGraph = document.getElementById('vvGraph');

    // Drawing Data
    let pathData = "M 40 230 ";
    let vhGraphData = "";
    let vvGraphData = "";

    function resetSim() {
        cancelAnimationFrame(animId);
        isPlaying = false;
        t = 0;
        pathData = "M 40 230 ";
        vhGraphData = "";
        vvGraphData = "";
        
        pathTrace.setAttribute('d', '');
        vhGraph.setAttribute('points', '');
        vvGraph.setAttribute('points', '');
        
        updateVisuals();
    }

    function playSim() {
        if (!isPlaying && t < max_t) {
            isPlaying = true;
            loop();
        } else if (t >= max_t) {
            resetSim();
            isPlaying = true;
            loop();
        }
    }

    function loop() {
        if (!isPlaying) return;
        
        t += dt;
        if (t >= max_t) {
            t = max_t;
            updateVisuals();
            isPlaying = false;
            return;
        }
        
        updateVisuals();
        animId = requestAnimationFrame(loop);
    }

    function updateVisuals() {
        // Calculate kinematics
        let current_vy = v_y0 - g * t;
        let x = 40 + (v_x * t);
        let y = 230 - ((v_y0 * t) - (0.5 * g * t * t));

        // 1. Update Motion SVG
        ball.setAttribute('cx', x);
        ball.setAttribute('cy', y);

        // Update trail
        if(t > 0) {
            pathData += `L ${x} ${y} `;
            pathTrace.setAttribute('d', pathData);
        }

        // Horizontal Vector (Constant length, always right)
        vhArrow.setAttribute('x1', x);
        vhArrow.setAttribute('y1', y);
        vhArrow.setAttribute('x2', x + v_x);
        vhArrow.setAttribute('y2', y);
        vhText.setAttribute('x', x + v_x + 8);
        vhText.setAttribute('y', y + 5);

        // Vertical Vector (Changes length, flips direction)
        vvArrow.setAttribute('x1', x);
        vvArrow.setAttribute('y1', y);
        vvArrow.setAttribute('x2', x);
        vvArrow.setAttribute('y2', y - current_vy);
        vvText.setAttribute('x', x - 30);
        vvText.setAttribute('y', (y - current_vy) + (current_vy > 0 ? -10 : 20));

        // 2. Update Graph SVG
        // Map time (0 to max_t) to X-axis (40 to 360)
        let graphX = 40 + (t / max_t) * 320; 
        
        // Map velocities to Y-axis (Origin is at y=140)
        let graphY_H = 140 - v_x; 
        let graphY_V = 140 - current_vy;

        if (t === 0 || t === dt) {
            vhGraphData += `${graphX},${graphY_H} `;
            vvGraphData += `${graphX},${graphY_V} `;
        } else {
            vhGraphData += `${graphX},${graphY_H} `;
            vvGraphData += `${graphX},${graphY_V} `;
        }

        vhGraph.setAttribute('points', vhGraphData);
        vvGraph.setAttribute('points', vvGraphData);
    }

    // Initialize initial state
    updateVisuals();
</script>

</body>
</html>
